# === prod profile ===
# SQL Server. Connection details come from the environment so nothing sensitive
# is committed. DB_PASSWORD has NO default — the app fails fast at startup if it
# is not set, which is the desired behavior for a secret.
#
#   export DB_PASSWORD=Password12
#   SPRING_PROFILES_ACTIVE=prod mvn spring-boot:run

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:productsdb};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD}
