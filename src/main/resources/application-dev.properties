# === dev profile ===
# In-memory H2 — no external database required. Data is re-seeded from data.sql
# on every start and lost on shutdown. Great for local dev and quick tests.

spring.datasource.url=jdbc:h2:mem:productsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:9090/h2-console (JDBC URL: jdbc:h2:mem:productsdb)
spring.h2.console.enabled=true

# Echo SQL to the logs while developing
spring.jpa.show-sql=true
