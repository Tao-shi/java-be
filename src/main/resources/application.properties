spring.application.name=java-be

# Active profile when none is supplied. Override at runtime with the
# SPRING_PROFILES_ACTIVE env var (env vars win over this file), e.g.
#   SPRING_PROFILES_ACTIVE=prod mvn spring-boot:run
#   mvn spring-boot:run -Dspring-boot.run.profiles=prod
# Datasource config lives in application-dev.properties / application-prod.properties.
spring.profiles.active=dev

server.port=9090

# --- JPA (common to all profiles) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seed only embedded DBs (H2/dev); never re-seeds an external DB like SQL Server
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true

# --- Actuator: expose health, info, metrics ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Swagger UI / OpenAPI ---
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# --- Logging levels (common; applied on top of logback-spring.xml) ---
logging.level.root=INFO
logging.level.com.example.javabe=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=INFO

# NOTE: JSON output, the log file, and the rolling policy are defined in
# src/main/resources/logback-spring.xml. The file appender is gated to the
# dev profile there, so prod logs JSON to stdout only (container-friendly).
