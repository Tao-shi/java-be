name: CI

# Build and test on every push and pull request to main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Build + test, and publish the jar as a shared artifact for the scan jobs.
  # ---------------------------------------------------------------------------
  build:
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pom targets Java 17 bytecode; verify it builds on the target (17)
        # and on the version used locally (21).
        java: [ '17', '21' ]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Tests run under the default 'dev' profile, which uses in-memory H2 —
      # no external database is needed on the runner.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # Publish the jar built on Java 21 so the scan jobs can reuse it.
      - name: Upload jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: java-be-jar
          path: target/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Security scans. All depend on `build` but NOT on each other, so once the
  # build passes they run in parallel:
  #
  #                 build
  #              /    |     \
  #      sonarcloud  snyk  gitleaks    <- run at the same time
  #        (code)   (deps)  (secrets)
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud scan
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full history so Sonar can attribute code to commits / compute "new code".
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Sonar re-runs the Maven build because it analyses compiled bytecode +
      # test coverage from its own workspace (it does not use the jar artifact).
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.APPLICATION_NAME }}
        run: >
          mvn -B --no-transfer-progress verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.APPLICATION_NAME }}
          -Dsonar.branch.name=main

  # --- CLI way (active): run the official Snyk image directly ----------------
  # Using the image as a container job gives full control over which commands
  # run (test / code / monitor / iac). SNYK_TOKEN in the env authenticates every
  # command, so no `snyk auth` step is needed. Snyk resolves dependencies from
  # pom.xml directly (needs the source, not the jar); the image ships JDK 21 + Maven.
  snyk:
    name: Snyk scan
    needs: build
    runs-on: ubuntu-latest
    container:
      # Pin by digest (snyk/snyk@sha256:...) for reproducible, supply-chain-safe runs.
      image: snyk/snyk:maven-3-jdk-21
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Dependency (SCA) scan. This fails the job on high/critical findings.
      # To make it report-only instead, add `continue-on-error: true` here.
      # Drop --severity-threshold to fail on issues of any severity.
      - name: Snyk dependency scan (SCA)
        run: snyk test --severity-threshold=high --sarif-file-output=snyk.sarif --org=${{ vars.SNYK_ORG_ID }}

      # Optional extras the CLI way unlocks — uncomment as needed:
      # - name: Snyk code scan (SAST)   # requires Snyk Code enabled in the org
      #   run: snyk code test --severity-threshold=high
      - name: Snyk monitor            # posts a snapshot to the Snyk dashboard
        if: always()
        run: snyk monitor

      - name: Check Snyk SARIF file exists
        if: always()
        run: ls -l

      - name: Upload SARIF artifact CodeQL way
        if: always()
        # uses: actions/upload-artifact@v7
        uses: github/codeql-action/upload-sarif@v3
        with:
          name: snyk-sarif
          path: snyk.sarif
          sarif_file: snyk.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        # uses: github/codeql-action/upload-sarif@v3
        with:
          name: snyk-sarif
          path: snyk.sarif
          sarif_file: snyk.sarif

  # --- Actions way (previous approach, kept for reference) -------------------
  # snyk:
  #   name: Snyk scan
  #   needs: build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out code
  #       uses: actions/checkout@v7
  #     - name: Run Snyk dependency scan
  #       uses: snyk/actions/maven-3-jdk-21@master
  #       # continue-on-error: true   # make the scan report-only
  #       env:
  #         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  #       with:
  #         args: --severity-threshold=high --sarif-file-output=snyk.sarif
  #     - uses: actions/upload-artifact@v7
  #       if: always()
  #       with:
  #         name: snyk-sarif
  #         path: snyk.sarif

  # --- Secret scanning: Gitleaks (CLI/Docker; the action needs a paid license
  # for org repos, the CLI is free). Scans the FULL git history for committed
  # secrets and fails the job if any are found. -------------------------------
  gitleaks:
    name: Gitleaks secret scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read           # checkout
      pull-requests: write     # post the PR comment
      security-events: write   # upload SARIF to code scanning
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit, not just the latest.
          fetch-depth: 0

      # Runs the official image via `docker run` (not a container job) to avoid
      # git "dubious ownership" issues when scanning the mounted workspace.
      # gitleaks exits non-zero if secrets are found -> the job fails.
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --report-format sarif --report-path /repo/gitleaks.sarif --redact -v

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

      - name: Upload SARIF file to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: my-static-analysis-tool

      # Post the scan summary as a PR comment. Only runs on pull_request events
      # (on a push there is no PR to comment on). The gh CLI is preinstalled on
      # the runner and reads GH_TOKEN automatically.
      - name: Comment on the Pull Request
        # if: github.event_name == 'pull_request'
        if: always()  # run even if the scan fails (so the comment is posted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat << 'EOF' > pr-comment.md
          ## Gitleaks Secret Scan Results
          The Gitleaks secret scan has completed. Please review the results below.

          | Metric         | Value |
          |----------------|-------|
          | Num of secrets | 50    |
          EOF

          gh pr comment "$PR_NUMBER" --body-file pr-comment.md

      # --- One-liner alternative (does the same thing) --------------------------
      # gh infers the PR from the branch, so you don't even need PR_NUMBER. It
      # only works when the workflow is triggered by a pull_request event.
      #
      # - name: Comment on the Pull Request (one-liner)
      #   if: github.event_name == 'pull_request'
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: gh pr comment "${{ github.event.pull_request.number }}" --body-file  "Gitleaks scan complete — see the run for details."