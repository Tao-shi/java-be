name: CI

# Build and test on every push and pull request to main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Build + test, and publish the jar as a shared artifact for the scan jobs.
  # ---------------------------------------------------------------------------
  build:
    name: Build & test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pom targets Java 17 bytecode; verify it builds on the target (17)
        # and on the version used locally (21).
        java: [ '17', '21' ]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Tests run under the default 'dev' profile, which uses in-memory H2 —
      # no external database is needed on the runner.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # Publish the jar built on Java 21 so the scan jobs can reuse it.
      - name: Upload jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: java-be-jar
          path: target/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Security scans. Both depend on `build` but NOT on each other, so once the
  # build passes they run in parallel:
  #
  #             build
  #            /     \
  #      sonarcloud   veracode      <- run at the same time
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud scan
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full history so Sonar can attribute code to commits / compute "new code".
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Sonar re-runs the Maven build because it analyses compiled bytecode +
      # test coverage from its own workspace (it does not use the jar artifact).
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.APPLICATION_NAME }}
        run: >
          mvn -B --no-transfer-progress verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.APPLICATION_NAME }}
          -Dsonar.branch.name=main

